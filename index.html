<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Rankings - The Best AI Companions</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #8b949e;
            margin-bottom: 40px;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .ai-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .ai-info h2 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
        }
        .ai-info p {
            margin: 0;
            color: #8b949e;
        }
        .hot-score {
            font-weight: bold;
            color: #ff4757;
            margin-top: 10px;
            display: inline-block;
        }
        .visit-btn {
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .visit-btn:hover {
            background-color: #2ea043;
        }
        .rank {
            font-size: 2rem;
            font-weight: bold;
            color: #484f58;
            margin-right: 20px;
            min-width: 30px;
        }
        .left-section {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Hot Rankings</h1>
    <p class="subtitle">The internet's live, data-driven AI companion leaderboard.</p>

    <div class="container" id="leaderboard">
        <p style="text-align:center; color:#8b949e;">Loading live rankings...</p>
    </div>

    <script>
        // Fetch the JSON file generated by our Python script
        fetch('live_rankings.json')
            .then(response => response.json())
            .then(data => {
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = ''; // Clear loading text

                data.forEach((ai, index) => {
                    const card = document.createElement('div');
                    card.className = 'ai-card';
                    
                    card.innerHTML = `
                        <div class="left-section">
                            <div class="rank">#${index + 1}</div>
                            <div class="ai-info">
                                <h2>${ai.name}</h2>
                                <p>${ai.description}</p>
                                <span class="hot-score">🔥 Hot Score: ${ai.hot_score}</span>
                            </div>
                        </div>
                        <a href="${ai.url}" target="_blank" class="visit-btn">Visit Site</a>
                    `;
                    
                    leaderboard.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('leaderboard').innerHTML = '<p style="color:red; text-align:center;">Failed to load live rankings. The script is currently calculating fresh scores.</p>';
            });
    </script>
</body>
</html>
